name: Refresh GitHub contribution data

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:github
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_FETCH_TOKEN }}
      - name: Commit updated data if changed
        # Pushed via CONTRIB_FETCH_TOKEN rather than the default GITHUB_TOKEN
        # so this commit actually triggers deploy-pages.yml's `on: push` —
        # GitHub Actions deliberately suppresses that for GITHUB_TOKEN pushes
        # to prevent workflow loops. No loop risk here: deploy-pages.yml
        # pushes to a different repo (On0n0k1.github.io), never back here.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-contributions.json
          if git diff --staged --quiet; then
            echo "No contribution data changes, skipping commit."
          else
            git commit -m "chore: refresh GitHub contribution data"
            git push https://x-access-token:${{ secrets.CONTRIB_FETCH_TOKEN }}@github.com/On0n0k1/portifolio.git HEAD:main
          fi
