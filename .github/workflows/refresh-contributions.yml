name: Refresh GitHub contribution data

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:github
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_FETCH_TOKEN }}
      - name: Commit updated data if changed
        # Pushing with the default GITHUB_TOKEN does not trigger new workflow
        # runs, so this can't loop even though the schedule trigger alone
        # already avoids the question.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-contributions.json
          if git diff --staged --quiet; then
            echo "No contribution data changes, skipping commit."
          else
            git commit -m "chore: refresh GitHub contribution data"
            git push
          fi
